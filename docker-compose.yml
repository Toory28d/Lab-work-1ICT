services:
  web:
    build: .
    image: lab3-flask:local
    ports:
      - "5000:5000"
    environment:
      APP_ENV: docker-compose
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
